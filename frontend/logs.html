<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Email send history, delivery statuses, and failures.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/assets/brand/favicon.png">
  <script src="/js/auth-guard.js?v=__ASSET_VERSION__"></script>
  <title>Logs - DesignHive Admin</title>
  <link rel="stylesheet" href="/css/app.css?v=__ASSET_VERSION__">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main-area">
      <div id="topbar"></div>
      <main class="page-content" id="main-content">
        <!-- Filters, live totals, and refresh share one row so the table starts
             higher up the page. -->
        <div class="page-header" style="flex-wrap:wrap">
          <div class="flex gap-2" style="flex-wrap:wrap">
            <div class="input-wrap" style="width:168px">
              <span class="icon"><i data-lucide="filter" style="width:13px;height:13px"></i></span>
              <select id="status-filter" aria-label="Filter by status">
                <option value="all">All Status</option>
                <option value="sent">Sent</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div class="input-wrap" style="width:160px">
              <span class="icon"><i data-lucide="calendar" style="width:13px;height:13px"></i></span>
              <select id="date-filter" aria-label="Filter by date">
                <option value="all">All Time</option>
                <option value="today">Today</option>
                <option value="yesterday">Yesterday</option>
              </select>
            </div>
          </div>
          <div class="flex-center gap-3" style="flex-wrap:wrap">
            <div class="badge badge-green"><span id="sent-count">0</span> Sent</div>
            <div class="badge badge-red"><span id="failed-count">0</span> Failed</div>
            <span id="updated-label" class="updated-just-now">Updated just now</span>
            <button class="btn btn-secondary btn-sm" type="button" id="refresh-btn">
              <i data-lucide="refresh-cw" style="width:14px;height:14px" id="refresh-icon"></i>
              Refresh
            </button>
          </div>
        </div>

        <div class="card" id="logs-card">
          <div style="padding:16px">
            <div class="skeleton users-skeleton-row"></div>
            <div class="skeleton users-skeleton-row"></div>
            <div class="skeleton users-skeleton-row"></div>
            <div class="skeleton users-skeleton-row"></div>
            <div class="skeleton users-skeleton-row"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/icons.js?v=__ASSET_VERSION__"></script>
  <script src="/js/axios.min.js?v=__ASSET_VERSION__"></script>
  <script src="/js/api.js?v=__ASSET_VERSION__"></script>
  <script src="/js/utils.js?v=__ASSET_VERSION__"></script>
  <script src="/js/toast.js?v=__ASSET_VERSION__"></script>
  <script src="/js/layout.js?v=__ASSET_VERSION__"></script>
  <script src="/js/logs-page.js?v=__ASSET_VERSION__"></script>
</body>
</html>
