<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Campaign health, draft approvals, and the AI assistant for DesignHive Admin.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/assets/brand/favicon.png">
  <script src="/js/auth-guard.js?v=__ASSET_VERSION__"></script>
  <title>Dashboard - DesignHive Admin</title>
  <link rel="stylesheet" href="/css/app.css?v=__ASSET_VERSION__">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main-area">
      <div id="topbar"></div>
      <main class="page-content" id="main-content">

        <!-- Reading order: health at a glance, then anything needing a
             decision, then the assistant, then the full template list. -->

        <!-- ── Stat cards ──────────────────────────────────────── -->
        <div class="grid grid-4 mb-4" id="stat-cards">
          <div class="card dashboard-stat-card skeleton"></div>
          <div class="card dashboard-stat-card skeleton"></div>
          <div class="card dashboard-stat-card skeleton"></div>
          <div class="card dashboard-stat-card skeleton"></div>
        </div>

        <!-- ── Draft notifications ─────────────────────────────── -->
        <div id="draft-notifications" hidden></div>

        <!-- ── AI Chat ─────────────────────────────────────────── -->
        <section class="chat-card" aria-label="AI assistant">
          <div class="chat-card-header">
            <i data-lucide="bot" style="width:16px;height:16px;color:var(--gold)"></i>
            <span class="chat-card-title">AI Assistant</span>
            <span class="chat-card-hint">Send campaigns, generate content, pull stats</span>
          </div>
          <div id="dash-chat-messages" class="chat-messages" role="log" aria-live="polite">
            <div class="dm dm--ai">
              <div class="dm-bubble">Hi! I can send campaigns, schedule emails, generate content, run agents, and pull stats — just tell me what you need.</div>
            </div>
          </div>
          <div class="chat-input-row">
            <textarea id="dash-chat-input" class="chat-input" rows="1"
              aria-label="Message the AI assistant"
              placeholder="e.g. Send the welcome email to new users…"></textarea>
            <button id="dash-chat-send" class="chat-send" title="Send" aria-label="Send message">
              <i data-lucide="send" style="width:16px;height:16px"></i>
            </button>
          </div>
        </section>

        <!-- ── Templates table ─────────────────────────────────── -->
        <div class="card">
          <div class="flex-between" style="padding:18px 20px;border-bottom:1px solid var(--border)">
            <span style="color:var(--text-primary);font-weight:700">All Templates / Campaigns</span>
            <a href="/templates.html" class="btn btn-ghost btn-sm">Manage</a>
          </div>
          <div id="templates-table-wrap">
            <div style="padding:16px"><div class="skeleton" style="height:180px"></div></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/icons.js?v=__ASSET_VERSION__"></script>
  <script src="/js/axios.min.js?v=__ASSET_VERSION__"></script>
  <script src="/js/api.js?v=__ASSET_VERSION__"></script>
  <script src="/js/utils.js?v=__ASSET_VERSION__"></script>
  <script src="/js/toast.js?v=__ASSET_VERSION__"></script>
  <script src="/js/layout.js?v=__ASSET_VERSION__"></script>
  <script src="/js/dashboard-page.js?v=__ASSET_VERSION__"></script>
</body>
</html>
